mjrp_harness:
  version: "1.0"
  profile: code-app          # code-app | content | meta
  process_level: standard     # minimal | standard | full
  context: lazy              # eager | lazy
  orchestration: assisted    # assisted | autonomous
  gates: [tasks]
  gate_sla_days: 14
  gates_open: []
  tech_stack:                # a tecnologia do PRODUTO - varia e evolui por projeto
    frontend: vanilla-html-css-js   # SPA de arquivo unico, sem build no M1
    backend: nenhum                 # 100% client-side
    apis: google-oauth2, google-drive-v3, google-picker
    hosting: github-pages
  stack:                     # QUEM FAZ O QUE - atribuicao de papel e decisao de instancia (§5.2.1)
    strategy: cowork
    build: claude-code
    review: antigravity
  environment:
    setup: nenhum             # comando de setup, ou 'nenhum' se não há pré-requisito
    runtime: ""               # ex.: 'python3, node' - preencha quando a stack existir
  sensors:
    placeholder: "true"  # troque pelo lint/test/build reais assim que a stack existir
  kernel:                    # as páginas da wiki do harness que este projeto carrega (I5)
    version: 2026-10-14
    source: 593c609d
    pages: [base-concept, vision-document, memory-architecture, context-vs-memory, project-profiles, terms, doctor, adr-practice, harness-concept, harness-elements, engineering-canon, spec-kit, agents-agentic-concepts, graph-engineering-concept, hooks-concept, loop-engineering-concept, harness-kaizen, design-canon, requirements-graph, knowledge-graph-concept, linked-notes-concept, git-governance, spreadsheet-standard, product-discovery, pdlc-loops, conformance-notes, palette-library, sketch-vs-prototype, architecture-review]
    vendored: [PRINCIPLES.md, mjrp-scripts/doctor.py, mjrp-scripts/structure_rules.json, mjrp-scripts/structure_check.py, mjrp-scripts/path_guard.py, mjrp-scripts/hooks/pre-commit, mjrp-scripts/session_lease.py, mjrp-scripts/prototype_inventory.py, mjrp-scripts/retired_names_check.py, mjrp-scripts/retired_skills.json, mjrp-scripts/daily_checks.py, mjrp-scripts/log_entry_check.py, mjrp-scripts/hooks/commit-msg, mjrp-scripts/prototype_sync_check.py, mjrp-scripts/session_journal.py, mjrp-scripts/requirements_graph_check.py, mjrp-scripts/requirements_graph_rules.json, mjrp-scripts/req_file_names.py, mjrp-scripts/visual_gate.py, mjrp-scripts/conformance_check.py, mjrp-scripts/canonical_catalog.json, mjrp-scripts/migrations/CM-0001-uat-v2.md, mjrp-scripts/migrations/CM-0002-roadmap.md, mjrp-scripts/migrations/CM-0003-releases.md, mjrp-scripts/migrations/CM-0004-feature-track.md, mjrp-scripts/migrations/CM-0005-evidence-folder.md, mjrp-scripts/migrations/CM-0006-contract-screen.md, mjrp-scripts/migrations/CM-0007-visual-sensor.md, mjrp-scripts/migrations/CM-0008-info-arch.md, mjrp-scripts/migrations/CM-0009-wireframes.md, mjrp-scripts/migrations/CM-0010-design-system.md, mjrp-scripts/migrations/CM-0011-arch-critique.md, mjrp-scripts/migrations/CM-0012-adr-names.md, mjrp-scripts/migrations/CM-0013-english-names.md, mjrp-scripts/migrations/CM-0014-purpose.md, mjrp-scripts/migrations/CM-0015-content-map.md, mjrp-scripts/migrations/CM-0016-report-names.md, mjrp-scripts/migrations/CM-0017-roadmap-id-prefix.md]     # copias carimbadas fora da wiki (PRINCIPLES.md, doctor.py) - I5 confere
  conformance:                   # ADR-0019: applied = notas cumpridas; received = escrito só pelo --refresh-kernel; waived = dispensa do humano
    applied: []
    received:
      uat@2: 2026-10-14
      roadmap@3: 2026-10-14
      releases@1: 2026-10-14
      feature-track@1: 2026-10-14
      evidence-folder@1: 2026-10-14
      arch-critique@1: 2026-10-14
      adr-names@1: 2026-10-14
      english-names@1: 2026-10-14
      report-names@1: 2026-10-14
