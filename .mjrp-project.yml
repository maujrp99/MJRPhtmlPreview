mjrp_harness:
  version: "1.0"
  profile: code-app          # code-app | content | meta
  process_level: standard     # minimal | standard | full
  context: lazy              # eager | lazy
  orchestration: assisted    # assisted | autonomous
  gates: [tasks]
  gate_sla_days: 14
  gates_open: []
  tech_stack:                # a tecnologia do PRODUTO - varia e evolui por projeto
    frontend: vanilla-html-css-js   # SPA de arquivo unico, sem build no M1
    backend: nenhum                 # 100% client-side
    apis: google-oauth2, google-drive-v3, google-picker
    hosting: github-pages
  stack:                     # QUEM FAZ O QUE - atribuicao de papel e decisao de instancia (§5.2.1)
    strategy: cowork
    build: claude-code
    review: antigravity
  environment:
    setup: nenhum             # comando de setup, ou 'nenhum' se não há pré-requisito
    runtime: ""               # ex.: 'python3, node' - preencha quando a stack existir
  sensors:
    placeholder: "true"  # troque pelo lint/test/build reais assim que a stack existir
  kernel:                    # as páginas da wiki do harness que este projeto carrega (I5)
    version: 2026-10-05
    source: a8e8514
    pages: [base-concept, vision-document, memory-architecture, context-vs-memory, project-profiles, terms, doctor, adr-practice, harness-concept, harness-elements, engineering-canon, spec-kit, agents-agentic-concepts, graph-engineering-concept, hooks-concept, loop-engineering-concept, harness-kaizen, design-canon, requirements-graph, knowledge-graph-concept, linked-notes-concept, git-governance]
    vendored: [PRINCIPLES.md, mjrp-scripts/doctor.py, mjrp-scripts/structure_rules.json, mjrp-scripts/structure_check.py, mjrp-scripts/path_guard.py, mjrp-scripts/hooks/pre-commit, mjrp-scripts/session_lease.py, mjrp-scripts/SDD_chain_artifacts_check.py, mjrp-scripts/daily_checks.py, mjrp-scripts/log_entry_check.py, mjrp-scripts/hooks/commit-msg, mjrp-scripts/session_journal.py, mjrp-scripts/requirements_graph_check.py, mjrp-scripts/requirements_graph_rules.json]     # copias carimbadas fora da wiki (PRINCIPLES.md, doctor.py) - I5 confere
